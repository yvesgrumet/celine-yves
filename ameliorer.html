<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --mauve:#9b6fc4;--mauve-f:#6a2fa0;--mauve-pale:#f0e8f9;--mauve-mid:#d4b8ef;
  --bleu:#3a6bbf;--bleu-pale:#e8eef9;
  --vert:#2e7d52;--vert-pale:#e6f4ec;
  --rouge:#c0392b;--rouge-pale:#fde8e8;
  --texte:#2a1a3e;--gris:#6b5d7a;--gris-pale:#f2edf8;
  --blanc:#fff;--fond:#f7f2fc;--radius:14px;
  --shadow:0 2px 16px rgba(120,80,180,.10);
}
html,body{
  height:100%;font-family:'DM Sans',sans-serif;
  background:var(--fond);color:var(--texte);font-size:15px;line-height:1.5;
  -webkit-font-smoothing:antialiased;
  max-width:480px;margin:0 auto;padding-bottom:80px;overflow-x:hidden;
}
body{height:auto;min-height:100%;padding-bottom:100px;}
.header{
  background:linear-gradient(135deg,#6a2fa0,#9b6fc4 60%,#c9a8e8);
  color:#fff;padding:18px 20px 16px;
  display:flex;align-items:center;gap:12px;
}
.header a{color:#fff;text-decoration:none;font-size:22px;}
.header-titre{font-family:'Playfair Display',serif;font-size:18px;font-weight:700;flex:1;}
.header-titre span{font-size:13px;font-weight:400;opacity:.75;display:block;}

.info-bloc{
  margin:14px 12px 0;background:linear-gradient(135deg,#f0e8f9,#e8d8f5);
  border-left:4px solid var(--mauve);border-radius:var(--radius);
  padding:10px 14px;font-size:12.5px;color:var(--mauve-f);line-height:1.55;
}

/* DEUX COLONNES */
.duo{display:grid;grid-template-columns:1fr 1fr;gap:10px;padding:12px;}
.colonne{
  background:var(--blanc);border-radius:var(--radius);
  box-shadow:var(--shadow);overflow:hidden;display:flex;flex-direction:column;
}
.col-header{
  padding:12px 12px 10px;display:flex;align-items:center;gap:8px;
  border-bottom:2px solid var(--mauve-pale);
}
.col-avatar{
  width:34px;height:34px;border-radius:50%;flex-shrink:0;
  display:flex;align-items:center;justify-content:center;
  font-family:'Playfair Display',serif;font-size:16px;font-weight:700;color:#fff;
}
.col-nom{font-family:'Playfair Display',serif;font-size:16px;font-weight:700;}
.colonne.celine .col-avatar{background:var(--bleu);}
.colonne.celine .col-nom{color:var(--bleu);}
.colonne.yves .col-avatar{background:var(--vert);}
.colonne.yves .col-nom{color:var(--vert);}

.col-body{padding:10px 12px 12px;flex:1;}

/* AJOUT */
.ajout-ligne{display:flex;gap:6px;margin-bottom:10px;}
.ajout-input{
  flex:1;min-width:0;padding:8px 10px;border-radius:10px;
  border:1.5px solid var(--mauve-mid);font-size:13px;
  font-family:'DM Sans',sans-serif;background:var(--blanc);color:var(--texte);outline:none;
}
.ajout-input:focus{border-color:var(--mauve);}
.ajout-btn{
  width:36px;height:36px;flex-shrink:0;border:none;border-radius:10px;
  color:#fff;font-size:20px;cursor:pointer;
  display:flex;align-items:center;justify-content:center;
}
.colonne.celine .ajout-btn{background:var(--bleu);}
.colonne.yves .ajout-btn{background:var(--vert);}
.ajout-btn:active{opacity:.8;}

/* POINTS */
.pt-liste{display:flex;flex-direction:column;gap:6px;}
.pt-item{
  display:flex;align-items:flex-start;gap:7px;
  padding:8px 9px;background:var(--gris-pale);border-radius:10px;
  animation:fadeIn .15s ease;
}
@keyframes fadeIn{from{opacity:0;transform:translateY(-4px)}to{opacity:1;transform:none}}
.pt-check{
  width:18px;height:18px;flex-shrink:0;cursor:pointer;margin-top:1px;
}
.colonne.celine .pt-check{accent-color:var(--bleu);}
.colonne.yves .pt-check{accent-color:var(--vert);}
.pt-txt{flex:1;font-size:13px;color:var(--texte);word-break:break-word;line-height:1.4;}
.pt-item.resolu .pt-txt{text-decoration:line-through;color:var(--gris);}
.pt-del{
  background:none;border:none;font-size:14px;cursor:pointer;
  color:var(--gris);padding:0 2px;flex-shrink:0;line-height:1.3;
  -webkit-tap-highlight-color:transparent;
}
.pt-del:active{color:var(--rouge);}
.pt-vide{font-size:12px;color:var(--gris);font-style:italic;text-align:center;padding:14px 4px;}
.pt-sep{
  font-size:10px;font-weight:700;color:var(--gris);text-transform:uppercase;
  letter-spacing:.4px;margin:12px 0 6px;
}

/* NAV BAS */
.nav-bas{
  position:fixed;bottom:0;left:50%;transform:translateX(-50%);
  width:100%;max-width:480px;background:var(--blanc);
  border-top:1px solid #e8e0f5;display:flex;
  justify-content:space-around;padding:8px 0 12px;
  z-index:100;box-shadow:0 -2px 16px rgba(120,80,180,.07);
}
.nav-item{
  display:flex;flex-direction:column;align-items:center;gap:3px;
  flex:1 1 0;min-width:0;white-space:nowrap;
  text-decoration:none;color:var(--gris);font-size:9px;font-weight:500;
  padding:4px 2px;border-radius:10px;
  transition:color .2s,background .2s;-webkit-tap-highlight-color:transparent;
}
.nav-item.actif,.nav-item:active{color:var(--mauve-f);background:var(--mauve-pale);}
.nav-item svg{width:22px;height:22px;stroke-width:1.7;}
</style>
</head>
<body>

<header class="header">
  <a href="index.html">←</a>
  <div class="header-titre">À améliorer<span>Céline & Yves</span></div>
</header>

<div class="info-bloc">
  📈 Chacun note ses points à améliorer. Cochez quand c'est réglé, la ligne se barre.
</div>

<div class="duo">
  <div class="colonne celine">
    <div class="col-header">
      <div class="col-avatar">C</div>
      <div class="col-nom">Céline</div>
    </div>
    <div class="col-body">
      <div class="ajout-ligne">
        <input class="ajout-input" id="inp-celine" type="text" placeholder="Un point à améliorer…"
          onkeydown="if(event.key==='Enter')ajouter('celine')">
        <button class="ajout-btn" onclick="ajouter('celine')">+</button>
      </div>
      <div id="liste-celine" class="pt-liste"></div>
    </div>
  </div>

  <div class="colonne yves">
    <div class="col-header">
      <div class="col-avatar">Y</div>
      <div class="col-nom">Yves</div>
    </div>
    <div class="col-body">
      <div class="ajout-ligne">
        <input class="ajout-input" id="inp-yves" type="text" placeholder="Un point à améliorer…"
          onkeydown="if(event.key==='Enter')ajouter('yves')">
        <button class="ajout-btn" onclick="ajouter('yves')">+</button>
      </div>
      <div id="liste-yves" class="pt-liste"></div>
    </div>
  </div>
</div>

<!-- NAV BAS -->
<nav class="nav-bas">
  <a href="index.html" class="nav-item">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><path d="M3 9.5L12 3l9 6.5V20a1 1 0 01-1 1H4a1 1 0 01-1-1V9.5z" stroke-linecap="round" stroke-linejoin="round"/><path d="M9 21V12h6v9" stroke-linecap="round" stroke-linejoin="round"/></svg>

  <a href="depenses.html" class="nav-item">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2z" stroke-linecap="round"/><path d="M12 6v2m0 8v2M9 9.5h4.5a1.5 1.5 0 110 3h-3a1.5 1.5 0 000 3H15" stroke-linecap="round" stroke-linejoin="round"/></svg>

<script>
/* ── Firebase ───────────────────────────────── */
firebase.initializeApp({
  apiKey: "AIzaSyB1cKDJSyHoUcq07yL8k7t_q3WNZ4ZaBJw",
  authDomain: "celine-yves.firebaseapp.com",
  databaseURL: "https://celine-yves-default-rtdb.europe-west1.firebasedatabase.app",
  projectId: "celine-yves",
  storageBucket: "celine-yves.firebasestorage.app",
  messagingSenderId: "1024885005035",
  appId: "1:1024885005035:web:fd92a0a8fc07eb78a17cae"
});
var db = firebase.database();
const AUTH_KEY='cy_app_auth';
function checkAuth(){
  if(localStorage.getItem(AUTH_KEY)){firebase.auth().signInAnonymously();return;}
  document.getElementById('pwOverlay').style.display='flex';
}
function submitPw(){
  const v=document.getElementById('pwInput').value.trim().toLowerCase();
  if(v==='amour'){
    firebase.auth().signInAnonymously().then(function(){
      localStorage.setItem(AUTH_KEY,'1');
      document.getElementById('pwOverlay').style.display='none';
    });
  } else {
    document.getElementById('pwError').style.display='block';
    document.getElementById('pwInput').value='';
  }
}
window.addEventListener('DOMContentLoaded',checkAuth);

/* ── État ──────────────────────────────────── */
var data = { celine:{}, yves:{} };

function escHtml(s){
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}

/* ── Listener ──────────────────────────────── */
db.ref("ameliorer").on("value", function(s){
  var v = s.val() || {};
  data = { celine: v.celine || {}, yves: v.yves || {} };
  render('celine');
  render('yves');
});

/* ── Rendu ─────────────────────────────────── */
function render(cote){
  var el = document.getElementById('liste-'+cote);
  var entries = Object.entries(data[cote] || {})
    .filter(function(e){ return !e[1].supprime; })
    .sort(function(a,b){ return (a[1].createdAt||'').localeCompare(b[1].createdAt||''); });

  var aFaire = entries.filter(function(e){ return !e[1].resolu; });
  var resolus = entries.filter(function(e){ return e[1].resolu; });

  if(entries.length===0){
    el.innerHTML = '<div class="pt-vide">Aucun point pour l\'instant</div>';
    return;
  }

  function ligne(e){
    var key = e[0], p = e[1];
    return '<div class="pt-item'+(p.resolu?' resolu':'')+'">' +
      '<input type="checkbox" class="pt-check"'+(p.resolu?' checked':'')+
        ' onchange="toggleResolu(\''+cote+'\',\''+key+'\','+(p.resolu?'true':'false')+')">' +
      '<span class="pt-txt">'+escHtml(p.texte||'')+'</span>' +
      '<button class="pt-del" onclick="supprimer(\''+cote+'\',\''+key+'\')" title="Supprimer">🗑️</button>' +
    '</div>';
  }

  var html = aFaire.map(ligne).join('');
  if(resolus.length>0){
    html += '<div class="pt-sep">✓ Réglés ('+resolus.length+')</div>' + resolus.map(ligne).join('');
  }
  el.innerHTML = html;
}

/* ── Actions ───────────────────────────────── */
function ajouter(cote){
  var inp = document.getElementById('inp-'+cote);
  var texte = inp.value.trim();
  if(!texte){ inp.focus(); return; }
  db.ref("ameliorer/"+cote).push({
    texte: texte,
    resolu: false,
    createdAt: new Date().toISOString()
  });
  inp.value = '';
  inp.focus();
}

function toggleResolu(cote, key, estResolu){
  db.ref("ameliorer/"+cote+"/"+key).update({ resolu: !estResolu });
}

function supprimer(cote, key){
  var p = (data[cote]||{})[key];
  if(!p) return;
  if(!confirm('Supprimer « '+(p.texte||'')+' » ?')) return;
  db.ref("ameliorer/"+cote+"/"+key).remove();
}
</script>

<div id="pwOverlay" style="display:none;position:fixed;inset:0;background:linear-gradient(135deg,#6a2fa0,#9b6fc4 60%,#c9a8e8);z-index:9999;align-items:center;justify-content:center;flex-direction:column;padding:30px;">
  <div style="background:#fff;border-radius:18px;padding:36px 28px;max-width:380px;width:100%;text-align:center;box-shadow:0 20px 60px rgba(0,0,0,0.3);">
    <div style="font-size:3rem;margin-bottom:14px;">🔐</div>
    <div style="font-family:'Playfair Display',serif;font-size:1.4rem;color:#6a2fa0;margin-bottom:8px;">Céline & Yves</div>
    <div style="font-size:0.92rem;color:#6b5d7a;margin-bottom:22px;">Entre le mot de passe</div>
    <input type="password" id="pwInput" style="width:100%;padding:14px;font-size:1.2rem;border:1.5px solid #d4b8ef;border-radius:24px;text-align:center;outline:none;color:#2a1a3e;letter-spacing:4px;" placeholder="••••••" onkeydown="if(event.key==='Enter')submitPw()">
    <div id="pwError" style="display:none;color:#c0392b;margin-top:10px;font-size:0.88rem;">❌ Mot de passe incorrect</div>
    <button onclick="submitPw()" style="margin-top:18px;width:100%;padding:14px;background:linear-gradient(135deg,#6a2fa0,#9b6fc4);color:#fff;border:none;border-radius:24px;font-size:1rem;cursor:pointer;font-family:'DM Sans',sans-serif;font-weight:700;">Entrer ✓</button>
  </div>
</div>
</body>
